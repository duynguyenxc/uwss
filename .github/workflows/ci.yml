name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feat/** ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Test imports
        run: |
          python -c "import yaml, requests, bs4, sqlalchemy, pydantic, feedparser, scrapy"
          echo "✅ All imports successful"
          
      - name: Test CLI help
        run: |
          python -m src.uwss.cli --help
          echo "✅ CLI help command successful"
          
      - name: Test parser build
        run: |
          python -c "
          from src.uwss.cli import build_parser
          p = build_parser()
          assert p is not None
          print('✅ Parser build successful')
          "
          
      - name: Test config validation
        run: |
          python -m src.uwss.cli config-validate --config config/config.yaml
          echo "✅ Config validation successful"

